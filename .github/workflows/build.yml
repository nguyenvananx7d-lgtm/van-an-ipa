name: Build VortexArena IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint localization strings
        shell: bash
        run: |
          set -eo pipefail
          plutil -lint YABAOCHEAT/Resources/Localizable.strings

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          # OTHER_LDFLAGS: -sectcreate embeds the entitlements plist into the
          # Mach-O as the __entitlements section at link time, so no external
          # signing tool is needed and the section survives an unsigned build.
          # TrollStore/permasigner-style installers read __entitlements back and
          # grant no-sandbox + springboard/frontboard launch at install time —
          # exactly the parity the working "Sophia" build has. Without it the
          # app installs sandboxed and can never touch the game container.
          xcodebuild -project VortexArena.xcodeproj -scheme YABAOCHEAT -configuration Release -sdk iphoneos -archivePath build/VortexArena.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO OTHER_LDFLAGS='$(inherited) -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker YABAOCHEAT.entitlements'

      - name: Verify bundle contents
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          for f in Localizable.strings Assembly-CSharp-patch.bytes client_public_key.der; do
            if [ ! -f "$APP/$f" ]; then
              echo "::error::required resource missing from bundle: $f"
              exit 1
            fi
            echo "ok $f"
          done

      - name: Sign with entitlements (codesign)
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          cp YABAOCHEAT/Resources/embedded.mobileprovision "$APP/embedded.mobileprovision"
          ls -l "$APP/embedded.mobileprovision"
          # Sign the whole app ad-hoc with the entitlements embedded in the code
          # signature. This is exactly the channel the working "Sophia" build
          # carries them in (ldid-style blob inside the Mach-O); TrollStore /
          # permasigner-family installers read entitlements from the signature
          # and re-sign with them, so on-device the app runs unsandboxed +
          # platform. The __entitlements section alone is not read by those
          # installers — that is why the previous build still logged
          # no-sandbox=false container-manager=false.
          codesign --force --sign - --entitlements YABAOCHEAT.entitlements "$APP"
          echo "codesign ok"

      - name: Verify installed entitlements channel
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          test -f "$APP/embedded.mobileprovision" || { echo "::error::embedded.mobileprovision missing"; exit 1; }
          # Secondary channel: the __entitlements section survives in the Mach-O.
          for key in com.apple.private.security.no-sandbox com.apple.springboard.launchapplications com.apple.frontboard.launchapplications com.apple.multitasking.termination; do
            grep -aq "$key" "$APP/YABAOCHEAT" || { echo "::error::key missing from binary: $key"; exit 1; }
          done
          # Primary channel: the code signature the install tool reads back.
          ent="$(codesign -d --entitlements - "$APP" 2>/dev/null || true)"
          echo "$ent"
          for key in com.apple.private.security.no-sandbox com.apple.springboard.launchapplications com.apple.frontboard.launchapplications com.apple.multitasking.termination com.apple.private.security.container-manager; do
            grep -q "$key" <<<"$ent" || { echo "::error::entitlement not in code signature: $key"; exit 1; }
          done

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build/Payload
          cp -R build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app build/Payload/
          cd build
          zip -r ../VortexArena-unsigned.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena-unsigned.ipa
          path: VortexArena-unsigned.ipa
