name: Build VortexArena IPA
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen ldid

      - name: Lint localization strings
        shell: bash
        run: |
          set -eo pipefail
          plutil -lint YABAOCHEAT/Resources/Localizable.strings

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .

      - name: Build unsigned IPA
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          xcodebuild -project VortexArena.xcodeproj -scheme YABAOCHEAT -configuration Release -sdk iphoneos -archivePath build/VortexArena.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Verify bundle contents
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          for f in Localizable.strings Assembly-CSharp-patch.bytes client_public_key.der; do
            if [ ! -f "$APP/$f" ]; then
              echo "::error::required resource missing from bundle: $f"
              exit 1
            fi
            echo "ok $f"
          done

      - name: Embed entitlements (ldid)
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          # ldid -S writes the __entitlements section into the Mach-O and
          # fake-signs it. TrollStore/permasigner-style installers read that
          # section back and grant no-sandbox + springboard/frontboard launch
          # at install time — exactly what the original YABAOCHEAT ("Sophia")
          # ships with. Without this section the app installs sandboxed and
          # cannot touch the game container at all.
          ldid -SYABAOCHEAT.entitlements "$APP/YABAOCHEAT"
          echo "ldid applied"

      - name: Verify embedded entitlements
        shell: bash
        run: |
          set -eo pipefail
          APP=build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app
          seen="$(ldid -e "$APP/YABAOCHEAT" || true)"
          echo "$seen"
          for key in com.apple.private.security.no-sandbox com.apple.springboard.launchapplications com.apple.frontboard.launchapplications com.apple.multitasking.termination com.apple.private.security.container-manager; do
            if ! grep -q "$key" <<<"$seen"; then
              echo "::error::entitlement missing after ldid: $key"
              exit 1
            fi
            echo "ok $key"
          done

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build/Payload
          cp -R build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app build/Payload/
          cd build
          zip -r ../VortexArena-unsigned.ipa Payload
          cd ..

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena-unsigned.ipa
          path: VortexArena-unsigned.ipa
