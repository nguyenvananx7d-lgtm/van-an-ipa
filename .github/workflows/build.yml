name: Build YABAOCHEAT

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yabaocheat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20

    env:
      SCHEME: YABAOCHEAT
      PROJECT: VortexArena.xcodeproj
      APP: build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint plist
        run: plutil -lint YABAOCHEAT/Info.plist

      - name: Reject conflict markers
        shell: bash
        run: |
          set -eo pipefail
          if grep -rnE '^(<{7}|={7}|>{7})' YABAOCHEAT project.yml; then
            echo "::error::merge conflict markers left in source"
            exit 1
          fi
          echo "no conflict markers"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .

      - name: Build unsigned archive
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          # -sectcreate embeds the entitlements into __TEXT,__entitlements as a
          # fallback for tools that scan the Mach-O. The codesign step below is
          # the channel TrollStore-family installers actually read.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/VortexArena.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS='$(inherited) -framework IOSurface -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker YABAOCHEAT.entitlements' \
            2>&1 | tee build/xcodebuild.log

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          set -eo pipefail
          grep -E "error:" build/xcodebuild.log | head -30 | sed -E \
            's#^([^:]*/)?([^/]+\.(swift|m|c|h|mm)):([0-9]+):([0-9]+): error: (.*)#::error file=\2,line=\4,col=\5::\6#' \
            || { echo "no error: lines found; tail of log:"; tail -40 build/xcodebuild.log; }

      - name: Sign ad-hoc with entitlements
        shell: bash
        run: |
          set -eo pipefail
          codesign --force --sign - --entitlements YABAOCHEAT.entitlements "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ../YABAOCHEAT-unsigned.ipa Payload
          cd ..
          unzip -l YABAOCHEAT-unsigned.ipa | tail -20
          ls -lh YABAOCHEAT-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YABAOCHEAT-unsigned
          path: YABAOCHEAT-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
