name: Build VortexArena IPA

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    env:
      SCHEME: YABAOCHEAT
      PROJECT: VortexArena.xcodeproj
      APP: build/VortexArena.xcarchive/Products/Applications/YABAOCHEAT.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Lint localization strings
        shell: bash
        run: |
          set -eo pipefail
          plutil -lint YABAOCHEAT/Resources/Localizable.strings
          plutil -lint YABAOCHEAT/Info.plist

      - name: Reject conflict markers
        shell: bash
        run: |
          set -eo pipefail
          if grep -rnE '^(<{7}|={7}|>{7})' YABAOCHEAT project.yml; then
            echo "::error::merge conflict markers left in source"
            exit 1
          fi
          echo "no conflict markers"

      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml --project .

      - name: Build unsigned archive
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p build
          # -sectcreate embeds YABAOCHEAT.entitlements into __TEXT,__entitlements.
          # TrollStore-family installers read entitlements from the code
          # signature, not from that section, so the section is only a fallback
          # for tools that scan the Mach-O. The codesign step below is the
          # channel that actually matters.
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/VortexArena.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            OTHER_LDFLAGS='$(inherited) -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __entitlements -Xlinker YABAOCHEAT.entitlements' \
            2>&1 | tee build/xcodebuild.log

      - name: Annotate build errors
        if: failure()
        shell: bash
        run: |
          set -eo pipefail
          grep -E "error:" build/xcodebuild.log | head -30 | sed -E \
            's#^([^:]*/)?([^/]+\.(swift|m|c|h|mm)):([0-9]+):([0-9]+): error: (.*)#::error file=\2,line=\4,col=\5::\6#' \
            || { echo "no error: lines found; tail of log:"; tail -40 build/xcodebuild.log; }

      - name: Verify bundle contents
        shell: bash
        run: |
          set -eo pipefail
          for f in Localizable.strings Assembly-CSharp-patch.bytes client_public_key.der localConfig.json; do
            test -f "$APP/$f" || { echo "::error::required resource missing from bundle: $f"; exit 1; }
            echo "ok $f"
          done
          for f in GhostPayload.dylib Rajdhani-Regular.ttf Rajdhani-Bold.ttf Rajdhani-SemiBold.ttf Rajdhani-Medium.ttf Cinzel.ttf; do
            test -f "$APP/$f" || { echo "::error::ghost/font asset missing from bundle: $f"; exit 1; }
            echo "ok $f"
          done

      - name: Sign ad-hoc with entitlements
        shell: bash
        run: |
          set -eo pipefail
          cp YABAOCHEAT/Resources/embedded.mobileprovision "$APP/embedded.mobileprovision"
          codesign --force --sign - --entitlements YABAOCHEAT.entitlements "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | head -20

      - name: Verify entitlements channel
        shell: bash
        run: |
          set -eo pipefail
          ent="$(codesign -d --entitlements - "$APP" 2>/dev/null || true)"
          echo "$ent"
          for key in \
            com.apple.private.security.no-sandbox \
            com.apple.springboard.launchapplications \
            com.apple.frontboard.launchapplications \
            com.apple.multitasking.termination \
            com.apple.private.security.container-manager; do
            grep -q "$key" <<<"$ent" || { echo "::error::entitlement not in code signature: $key"; exit 1; }
          done
          for key in \
            com.apple.private.security.no-sandbox \
            com.apple.springboard.launchapplications; do
            grep -aq "$key" "$APP/YABAOCHEAT" || { echo "::error::key missing from __entitlements section: $key"; exit 1; }
          done

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry ../VortexArena-unsigned.ipa Payload
          cd ..
          unzip -l VortexArena-unsigned.ipa | tail -20
          ls -lh VortexArena-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena-unsigned
          path: VortexArena-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena-build-log
          path: |
            build/**/*.log
            build/**/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 7
