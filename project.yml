name: VortexArena
options:
  deploymentTarget:
    iOS: 16.0
  createIntermediateGroups: true
  bundleIdPrefix: com.apple.mobile

settings:
  base:
    INFOPLIST_FILE: YABAOCHEAT/Info.plist
    PRODUCT_NAME: YABAOCHEAT
    PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1

targets:
  YABAOCHEAT:
    type: application
    platform: iOS
    sources:
      - path: YABAOCHEAT
        excludes:
          - "Info.plist"
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        EXECUTABLE_NAME: YABAOCHEAT
        DISPLAY_NAME: Vortex Arena
        SWIFT_OBJC_BRIDGING_HEADER: YABAOCHEAT/YABAOCHEAT-Bridging-Header.h
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        OTHER_LDFLAGS:
          - -framework
          - IOSurface

schemes:
  YABAOCHEAT:
    build:
      targets:
        YABAOCHEAT: all
    run:
      config: Release
    archive:
      config: Release
