name: DeltaClient
options:
  deploymentTarget:
    iOS: 16.0
  createIntermediateGroups: true
  bundleIdPrefix: com.apple.mobile

settings:
  base:
    INFOPLIST_FILE: YABAOCHEAT/Info.plist
    PRODUCT_NAME: YABAOCHEAT
    PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1

targets:
  YABAOCHEAT:
    type: application
    platform: iOS
    sources:
      # Everything but Resources — that tree is added explicitly below, because
      # a target-level `resources:` key does not exist in the XcodeGen spec and
      # is dropped without warning. Excluded here, re-added there: each file
      # lands in Copy Bundle Resources exactly once.
      - path: YABAOCHEAT
        excludes:
          - "Recovered/**"
          - "Model/RecoveredTypes.swift"
          - "Resources/**"
          - "Info.plist"
      - path: YABAOCHEAT/Resources
        buildPhase: resources
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        EXECUTABLE_NAME: YABAOCHEAT
        DISPLAY_NAME: Delta Client
        SWIFT_OBJC_BRIDGING_HEADER: YABAOCHEAT/YABAOCHEAT-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: true

schemes:
  YABAOCHEAT:
    build:
      targets:
        YABAOCHEAT: all
    run:
      config: Release
    archive:
      config: Release
