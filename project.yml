name: VortexArena
options:
  deploymentTarget:
    iOS: 16.0
  createIntermediateGroups: true
  bundleIdPrefix: com.apple.mobile

settings:
  base:
    INFOPLIST_FILE: YABAOCHEAT/Info.plist
    PRODUCT_NAME: YABAOCHEAT
    PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: 5.9
    IPHONEOS_DEPLOYMENT_TARGET: 16.0
    TARGETED_DEVICE_FAMILY: 1

targets:
  YABAOCHEAT:
    type: application
    platform: iOS
    sources:
      # Everything but Resources — that tree is added explicitly below, because
      # a target-level `resources:` key does not exist in the XcodeGen spec and
      # is dropped without warning. Excluded here, re-added there: each file
      # lands in Copy Bundle Resources exactly once.
      - path: YABAOCHEAT
        excludes:
          - "Recovered/**"
          - "Model/RecoveredTypes.swift"
          - "Resources/**"
          - "Info.plist"
      - path: YABAOCHEAT/Resources
        buildPhase: resources
    dependencies:
      # Built as its own Mach-O so the payload can be mapped into the game
      # before IL2CPP starts. The app never links against it; the post-build
      # script copies it into the bundle.
      - target: GhostPayload
        embed: false
        link: false
    postBuildScripts:
      - name: Embed GhostPayload
        script: |
          set -e
          SRC="${BUILT_PRODUCTS_DIR}/GhostPayload.dylib"
          DST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/GhostPayload.dylib"
          if [ ! -f "$SRC" ]; then
            echo "error: GhostPayload.dylib missing at $SRC"
            exit 1
          fi
          cp "$SRC" "$DST"
          if command -v codesign >/dev/null 2>&1; then
            codesign --force --sign - "$DST" >/dev/null 2>&1 || true
          fi
        inputFiles:
          - "$(BUILT_PRODUCTS_DIR)/GhostPayload.dylib"
        outputFiles:
          - "$(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GhostPayload.dylib"
    settings:
      base:
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        EXECUTABLE_NAME: YABAOCHEAT
        DISPLAY_NAME: Vortex Arena
        SWIFT_OBJC_BRIDGING_HEADER: YABAOCHEAT/YABAOCHEAT-Bridging-Header.h
        CLANG_ENABLE_OBJC_ARC: true
        ENABLE_USER_SCRIPT_SANDBOXING: NO

  GhostPayload:
    type: library.dynamic
    platform: iOS
    sources:
      - path: GhostPayload/src
      - path: GhostPayload/include
        buildPhase: none
    settings:
      base:
        PRODUCT_NAME: GhostPayload
        PRODUCT_BUNDLE_IDENTIFIER: com.apple.mobile.MobileHouseArrest.ghost
        INFOPLIST_FILE: ""
        GENERATE_INFOPLIST_FILE: NO
        MACH_O_TYPE: mh_dylib
        SKIP_INSTALL: YES
        CODE_SIGNING_ALLOWED: NO
        CLANG_ENABLE_MODULES: NO
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/GhostPayload/include"
        OTHER_CFLAGS:
          - "-fobjc-arc"

schemes:
  YABAOCHEAT:
    build:
      targets:
        YABAOCHEAT: all
    run:
      config: Release
    archive:
      config: Release
