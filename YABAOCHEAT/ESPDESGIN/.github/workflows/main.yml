name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag for the release (e.g. v1.0.0)'
        required: false
        default: 'latest'
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build:
    name: Build ESP Patch & Package IPA
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build patch (ESP-only)
        id: build
        shell: pwsh
        run: |
          ./build.ps1 -KeepBuildArtifacts
          $manifest = Get-Content -LiteralPath dist/Assembly-CSharp-patch.manifest.json -Raw | ConvertFrom-Json
          echo "patch_sha256=$($manifest.sha256)" >> $env:GITHUB_OUTPUT
          echo "game_version=$($manifest.game_version)" >> $env:GITHUB_OUTPUT
          echo "=== Build Summary ==="
          echo "Version: $($manifest.game_version)"
          echo "Size: $($manifest.size) bytes"
          echo "SHA256: $($manifest.sha256)"
          echo "Features: $($manifest.features -join ', ')"

      - name: Package IPA
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.build.outputs.game_version }}"
          $hash = "${{ steps.build.outputs.patch_sha256 }}"
          $shortHash = $hash.Substring(0, 8)
          $ipaName = "ESP-Patch-v${version}-${shortHash}.ipa"

          New-Item -ItemType Directory -Path "Payload/GameApp.app/Data/Managed" -Force | Out-Null
          Copy-Item -Path "dist/Assembly-CSharp-patch.bytes" -Destination "Payload/GameApp.app/Data/Managed/Assembly-CSharp-patch.bytes" -Force
          Copy-Item -Path "dist/Assembly-CSharp-patch.manifest.json" -Destination "Payload/GameApp.app/Data/Managed/patch-manifest.json" -Force

          Compress-Archive -Path "Payload" -DestinationPath "temp.zip" -Force
          Move-Item -Path "temp.zip" -Destination $ipaName -Force

          echo "ipa_name=$ipaName" >> $env:GITHUB_ENV
          Write-Host "Created IPA: $ipaName"
          Get-Item $ipaName | Select-Object Name, Length

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ env.ipa_name }}
          retention-days: 90

      - name: Upload patch artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp-patch
          path: |
            dist/Assembly-CSharp-patch.bytes
            dist/Assembly-CSharp-patch.manifest.json
            dist/Assembly-CSharp-patch.report.json
            dist/Assembly-CSharp-patch.verify.json
          retention-days: 90

      - name: Create Release (on manual trigger)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version_tag || format('v{0}', steps.build.outputs.game_version) }}
          name: "ESP Patch ${{ steps.build.outputs.game_version }}"
          body: |
            ## ESP-Only Visual Patch
            **Game Version:** `${{ steps.build.outputs.game_version }}`
            **Patch SHA256:** `${{ steps.build.outputs.patch_sha256 }}`
            - ✅ ESP Box, Tracer, Health Bar, Player Name, Distance
            - ❌ Removed all Aim, Recoil, Speed, Parachute features
          files: |
            ${{ env.ipa_name }}
            dist/Assembly-CSharp-patch.bytes
            dist/Assembly-CSharp-patch.manifest.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
