name: ffxc-auth

services:
  auth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ffxc-auth:latest
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - ../keys:/app/keys:ro
      - ../data:/app/data
    expose:
      - "8787"

  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: ffxc-auth:latest
    restart: unless-stopped
    # Same image, second entry point: the TLS relay the device's profile points
    # at. Capture and rules live under the shared data volume.
    command: ["node", "dist/src/proxy/server.js"]
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
    ports:
      - "1299:1299"
      - "8080:8080"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - auth
    env_file:
      - ../.env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
